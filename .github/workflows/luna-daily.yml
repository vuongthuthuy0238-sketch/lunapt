name: Luna Daily Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Luna
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python agent.py
      - name: Commit agent state
        run: |
          git config user.name "luna-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json reports/ logs/
          git diff --cached --quiet || git commit -m "chore: Luna daily run"
          git push
